name: Test UnityPy on Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-unitypy-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python for build tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Generate minimal Chaquopy compatibility app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/assetflux/unitypytest
          mkdir -p app/src/main/python
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AssetFlux-UnityPy-Android-Test"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.chaquo.python' version '17.0.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.chaquo.python'
          }

          android {
              namespace 'com.assetflux.unitypytest'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.assetflux.unitypytest'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "0.1.0"

                  ndk {
                      abiFilters "arm64-v8a", "armeabi-v7a"
                  }

                  python {
                      version "3.11"
                      pip {
                          // Compatibility probe: UnityPy's compiled dependencies
                          // may require Android-compatible wheels.
                          install "UnityPy"
                      }
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:colorAccent">#6750A4</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="AssetFlux UnityPy Test"
                  android:allowBackup="false"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/python/unity_probe.py <<'PY'
          import json
          import traceback

          def probe():
              result = {
                  "unitypy_imported": False,
                  "unitypy_version": None,
                  "dependencies": {},
                  "error": None,
              }
              try:
                  import UnityPy
                  result["unitypy_imported"] = True
                  result["unitypy_version"] = getattr(UnityPy, "__version__", "unknown")
                  for module_name in ("lz4", "brotli", "PIL", "texture2ddecoder", "etcpak"):
                      try:
                          __import__(module_name)
                          result["dependencies"][module_name] = "ok"
                      except Exception as exc:
                          result["dependencies"][module_name] = f"FAILED: {type(exc).__name__}: {exc}"
              except Exception as exc:
                  result["error"] = f"{type(exc).__name__}: {exc}"
                  result["traceback"] = traceback.format_exc()
              return json.dumps(result, indent=2)
          PY

          cat > app/src/main/java/com/assetflux/unitypytest/MainActivity.kt <<'EOF'
          package com.assetflux.unitypytest

          import android.app.Activity
          import android.os.Bundle
          import android.widget.ScrollView
          import android.widget.TextView
          import com.chaquo.python.Python
          import com.chaquo.python.android.AndroidPlatform

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val output = TextView(this).apply {
                      textSize = 14f
                      setPadding(24, 24, 24, 24)
                      text = "Memulai pengujian UnityPy..."
                  }
                  setContentView(ScrollView(this).apply { addView(output) })

                  Thread {
                      val result = try {
                          if (!Python.isStarted()) {
                              Python.start(AndroidPlatform(this))
                          }
                          Python.getInstance()
                              .getModule("unity_probe")
                              .callAttr("probe")
                              .toString()
                      } catch (e: Exception) {
                          "GAGAL MEMULAI PYTHON:\n${e.javaClass.simpleName}: ${e.message}"
                      }
                      runOnUiThread {
                          output.text = "AssetFlux — Uji kompatibilitas UnityPy\n\n$result"
                      }
                  }.start()
              }
          }
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build compatibility APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlux-UnityPy-Android-Compatibility-Test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
