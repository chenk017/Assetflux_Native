name: AssetFlux UnityBundle Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UnityPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install UnityPy

      - name: Validate source bundle
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="samples/nextkagura_skill03_effect_1.unity3d"

          if [ ! -f "$SOURCE" ]; then
            echo "::error::Bundle tidak ditemukan: $SOURCE"
            exit 1
          fi

          echo "Bundle ditemukan."
          ls -lh "$SOURCE"

      - name: Extract assets and relationships
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/textures
          mkdir -p output/meshes
          mkdir -p output/audio
          mkdir -p output/textassets
          mkdir -p output/diagnostics

          cat > extract_unity.py <<'PYTHON'
          import json
          import traceback
          from pathlib import Path

          import UnityPy

          SOURCE = Path(
              "samples/nextkagura_skill03_effect_1.unity3d"
          )

          OUT = Path("output")
          TEXTURES = OUT / "textures"
          MESHES = OUT / "meshes"
          AUDIO = OUT / "audio"
          TEXTASSETS = OUT / "textassets"
          DIAGNOSTICS = OUT / "diagnostics"

          for directory in (
              TEXTURES,
              MESHES,
              AUDIO,
              TEXTASSETS,
              DIAGNOSTICS,
          ):
              directory.mkdir(parents=True, exist_ok=True)

          def safe_name(value):
              value = str(value or "unnamed")
              return "".join(
                  c if c.isalnum() or c in "-_." else "_"
                  for c in value
              )[:100] or "unnamed"

          def get_name(data):
              try:
                  return str(getattr(data, "m_Name", "") or "")
              except Exception:
                  return ""

          def pointer_info(value):
              """Return a pointer description without dereferencing it."""
              if value is None:
                  return None

              result = {}

              for attr in ("file_id", "path_id"):
                  try:
                      v = getattr(value, attr, None)
                      if v is not None:
                          result[attr] = int(v)
                  except Exception:
                      pass

              if result:
                  result["python_type"] = type(value).__name__
                  return result

              return None

          def walk(value, path="$", depth=0, seen=None):
              """
              Find serialized pointer references while avoiding cycles.
              The output is diagnostic metadata, not a full Unity serializer.
              """
              if seen is None:
                  seen = set()

              if depth > 12:
                  return []

              ptr = pointer_info(value)
              if ptr is not None:
                  return [{
                      "field": path,
                      "reference": ptr,
                  }]

              if value is None or isinstance(
                  value, (str, bytes, int, float, bool)
              ):
                  return []

              ident = id(value)
              if ident in seen:
                  return []
              seen.add(ident)

              found = []

              if isinstance(value, dict):
                  items = value.items()
              elif isinstance(value, (list, tuple, set)):
                  items = enumerate(value)
              else:
                  # Avoid traversing arbitrary Python internals.
                  try:
                      attrs = vars(value)
                  except Exception:
                      attrs = None

                  if attrs is None:
                      return found

                  items = attrs.items()

              try:
                  for key, child in items:
                      child_path = f"{path}.{key}"

                      found.extend(
                          walk(
                              child,
                              child_path,
                              depth + 1,
                              seen,
                          )
                      )
              except Exception:
                  pass

              return found

          def json_safe(value, depth=0):
              """Convert common UnityPy values to JSON-safe diagnostics."""
              if depth > 6:
                  return "<max-depth>"

              if value is None or isinstance(
                  value, (str, int, float, bool)
              ):
                  return value

              ptr = pointer_info(value)
              if ptr is not None:
                  return {"pointer": ptr}

              if isinstance(value, bytes):
                  return {
                      "type": "bytes",
                      "length": len(value),
                  }

              if isinstance(value, dict):
                  result = {}
                  for k, v in list(value.items())[:300]:
                      result[str(k)] = json_safe(v, depth + 1)
                  return result

              if isinstance(value, (list, tuple)):
                  return [
                      json_safe(v, depth + 1)
                      for v in value[:300]
                  ]

              try:
                  attrs = vars(value)
              except Exception:
                  return {
                      "type": type(value).__name__,
                      "repr": str(value)[:300],
                  }

              result = {"type": type(value).__name__}

              for key, child in list(attrs.items())[:100]:
                  if key.startswith("_"):
                      continue
                  try:
                      result[key] = json_safe(child, depth + 1)
                  except Exception:
                      result[key] = "<unavailable>"

              return result

          report = {
              "source": str(SOURCE),
              "unitypy_version": getattr(
                  UnityPy, "__version__", "unknown"
              ),
              "asset_count": 0,
              "assets": [],
              "exports": {
                  "textures": [],
                  "meshes": [],
                  "audio": [],
                  "textassets": [],
              },
              "errors": [],
          }

          print(f"Loading bundle: {SOURCE}")
          env = UnityPy.load(str(SOURCE))

          objects = list(env.objects)
          report["asset_count"] = len(objects)

          print(f"Objects found: {len(objects)}")

          for index, obj in enumerate(objects):
              try:
                  type_name = str(obj.type.name)
              except Exception:
                  type_name = "Unknown"

              try:
                  path_id = int(obj.path_id)
              except Exception:
                  path_id = index

              record = {
                  "type": type_name,
                  "path_id": path_id,
                  "name": "",
                  "export_status": "inventory_only",
                  "references": [],
                  "data": {},
              }

              try:
                  data = obj.read()
                  record["name"] = get_name(data)

                  # Record references found in serialized fields.
                  try:
                      record["references"] = walk(data)
                  except Exception as exc:
                      record["reference_scan_error"] = str(exc)

                  # Keep selected metadata for analysis.
                  if type_name in (
                      "GameObject",
                      "Transform",
                      "MeshFilter",
                      "MeshRenderer",
                      "SkinnedMeshRenderer",
                      "Material",
                      "Mesh",
                      "AnimationClip",
                      "Animation",
                      "ParticleSystem",
                      "ParticleSystemRenderer",
                      "Shader",
                      "Texture2D",
                  ):
                      try:
                          record["data"] = json_safe(data)
                      except Exception as exc:
                          record["data_error"] = str(exc)

                  stem = (
                      f"{path_id}_"
                      f"{safe_name(record['name'] or type_name)}"
                  )

                  # Texture2D -> PNG
                  if type_name == "Texture2D":
                      try:
                          image = data.image
                          if image is None:
                              raise RuntimeError(
                                  "UnityPy returned no image"
                              )

                          destination = TEXTURES / f"{stem}.png"
                          image.save(destination)

                          record["export_status"] = "exported"
                          record["export_path"] = str(destination)

                          report["exports"]["textures"].append(
                              str(destination)
                          )

                      except Exception as exc:
                          record["export_status"] = "failed"
                          record["export_error"] = str(exc)

                  # Mesh -> attempt supported UnityPy exporter.
                  elif type_name == "Mesh":
                      try:
                          exporter = getattr(data, "export", None)

                          if not callable(exporter):
                              raise RuntimeError(
                                  "Mesh.export() is unavailable "
                                  "in this UnityPy version"
                              )

                          exported = exporter()

                          if isinstance(exported, bytes):
                              destination = MESHES / f"{stem}.bin"
                              destination.write_bytes(exported)

                          elif isinstance(exported, str):
                              destination = MESHES / f"{stem}.txt"
                              destination.write_text(
                                  exported,
                                  encoding="utf-8",
                              )

                          elif isinstance(exported, dict):
                              destination = MESHES / f"{stem}.json"
                              destination.write_text(
                                  json.dumps(
                                      json_safe(exported),
                                      indent=2,
                                  ),
                                  encoding="utf-8",
                              )

                          elif exported is not None:
                              destination = (
                                  MESHES / f"{stem}_export.txt"
                              )
                              destination.write_text(
                                  repr(exported),
                                  encoding="utf-8",
                              )

                          else:
                              raise RuntimeError(
                                  "Mesh exporter returned None"
                              )

                          record["export_status"] = (
                              "exporter_returned_data"
                          )
                          record["export_path"] = str(destination)
                          record["export_note"] = (
                              "Output format must be verified; "
                              "this does not guarantee OBJ export."
                          )

                          report["exports"]["meshes"].append(
                              str(destination)
                          )

                      except Exception as exc:
                          record["export_status"] = (
                              "inventory_only"
                          )
                          record["export_error"] = str(exc)

                          diagnostic = (
                              DIAGNOSTICS / f"{stem}_mesh.json"
                          )

                          diagnostic.write_text(
                              json.dumps(
                                  {
                                      "path_id": path_id,
                                      "name": record["name"],
                                      "type": type_name,
                                      "error": str(exc),
                                      "available_methods": [
                                          method
                                          for method in dir(data)
                                          if not method.startswith("_")
                                      ],
                                      "serialized_data": json_safe(data),
                                  },
                                  indent=2,
                                  ensure_ascii=False,
                              ),
                              encoding="utf-8",
                          )

                  # AudioClip -> raw audio data when available.
                  elif type_name == "AudioClip":
                      try:
                          audio_data = getattr(
                              data, "m_AudioData", None
                          )

                          if not audio_data:
                              raise RuntimeError(
                                  "No embedded m_AudioData"
                              )

                          destination = AUDIO / f"{stem}.bin"
                          destination.write_bytes(audio_data)

                          record["export_status"] = "exported"
                          record["export_path"] = str(destination)

                          report["exports"]["audio"].append(
                              str(destination)
                          )

                      except Exception as exc:
                          record["export_status"] = (
                              "inventory_only"
                          )
                          record["export_error"] = str(exc)

                  # TextAsset -> bytes
                  elif type_name == "TextAsset":
                      try:
                          text_data = getattr(
                              data, "m_Script", ""
                          )

                          if isinstance(text_data, str):
                              payload = text_data.encode("utf-8")
                          else:
                              payload = bytes(text_data)

                          destination = (
                              TEXTASSETS / f"{stem}.bin"
                          )
                          destination.write_bytes(payload)

                          record["export_status"] = "exported"
                          record["export_path"] = str(destination)

                          report["exports"]["textassets"].append(
                              str(destination)
                          )

                      except Exception as exc:
                          record["export_status"] = (
                              "inventory_only"
                          )
                          record["export_error"] = str(exc)

              except Exception as exc:
                  record["export_status"] = "read_failed"
                  record["error"] = str(exc)
                  report["errors"].append({
                      "type": type_name,
                      "path_id": path_id,
                      "error": str(exc),
                      "traceback": traceback.format_exc(),
                  })

              report["assets"].append(record)

              print(
                  f"[{index + 1}/{len(objects)}] "
                  f"{type_name} "
                  f"path_id={path_id} "
                  f"status={record['export_status']}"
              )

          report_path = OUT / "asset_report.json"
          report_path.write_text(
              json.dumps(
                  report,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          # Human-readable summary.
          summary_path = OUT / "SUMMARY.txt"

          counts = {}
          statuses = {}

          for asset in report["assets"]:
              kind = asset["type"]
              status = asset["export_status"]

              counts[kind] = counts.get(kind, 0) + 1
              statuses[status] = statuses.get(status, 0) + 1

          lines = [
              "AssetFlux UnityBundle Extraction",
              f"Source: {SOURCE}",
              f"UnityPy version: {report['unitypy_version']}",
              f"Total objects: {report['asset_count']}",
              "",
              "Object counts:",
          ]

          for kind, count in sorted(counts.items()):
              lines.append(f"  {kind}: {count}")

          lines.extend(["", "Export statuses:"])

          for status, count in sorted(statuses.items()):
              lines.append(f"  {status}: {count}")

          lines.extend([
              "",
              f"Textures exported: "
              f"{len(report['exports']['textures'])}",
              f"Mesh outputs: "
              f"{len(report['exports']['meshes'])}",
              f"Audio outputs: "
              f"{len(report['exports']['audio'])}",
              f"TextAsset outputs: "
              f"{len(report['exports']['textassets'])}",
              f"Errors: {len(report['errors'])}",
              "",
              "Important:",
              "- Mesh output is not guaranteed to be OBJ.",
              "- Inspect mesh diagnostics before implementing "
              "a custom mesh decoder.",
              "- References are serialized pointer candidates; "
              "verify relationships before using them.",
          ])

          summary_path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print("\nExtraction complete.")
          print(summary_path.read_text(encoding="utf-8"))
          PYTHON

          python extract_unity.py

      - name: Upload extraction results
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlux-UnityPy-Extraction
          path: output/
          if-no-files-found: error
          retention-days: 7