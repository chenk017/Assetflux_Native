name: AssetFlux - UnityPy Extractor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      # cache pip sengaja tidak digunakan karena
      # repository belum memiliki requirements.txt.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install UnityPy
      - name: Install UnityPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install UnityPy
          python -c "import UnityPy; print('UnityPy berhasil diinstal')"

      # 4. Validate input
      - name: Check input bundle
        run: |
          FILE="samples/nextkagura_skill03_effect_1.unity3d"

          if [ ! -f "$FILE" ]; then
            echo "::error::Bundle tidak ditemukan: $FILE"
            echo "Pastikan file sudah diunggah ke folder samples."
            exit 1
          fi

          echo "Bundle ditemukan:"
          ls -lh "$FILE"

      # 5. Create output directories
      - name: Prepare output directories
        run: |
          mkdir -p output/textures
          mkdir -p output/textassets
          mkdir -p output/audio
          mkdir -p output/other

      # 6. Create UnityPy extractor
      - name: Create UnityPy extractor
        shell: bash
        run: |
          cat > extract_unity.py <<'PYTHON'
          import json
          import traceback
          from pathlib import Path

          import UnityPy

          SOURCE = Path(
              "samples/nextkagura_skill03_effect_1.unity3d"
          )

          OUTPUT = Path("output")

          for folder in (
              "textures",
              "textassets",
              "audio",
              "other",
          ):
              (OUTPUT / folder).mkdir(
                  parents=True,
                  exist_ok=True,
              )

          def safe_name(value):
              value = str(value or "unnamed")
              return "".join(
                  c if c.isalnum() or c in "-_." else "_"
                  for c in value
              )[:100]

          report = {
              "input": str(SOURCE),
              "file_size": SOURCE.stat().st_size,
              "unitypy_version": getattr(
                  UnityPy, "__version__", "unknown"
              ),
              "status": "starting",
              "asset_count": 0,
              "assets": [],
              "export_errors": [],
          }

          print("=" * 60)
          print("ASSETFLUX UNITYPY EXTRACTOR")
          print("=" * 60)
          print("Input:", SOURCE)
          print("Size:", SOURCE.stat().st_size, "bytes")

          try:
              # Load bundle with UnityPy.
              env = UnityPy.load(str(SOURCE))

              for index, obj in enumerate(env.objects):
                  record = {
                      "index": index,
                      "type": str(obj.type.name),
                      "path_id": int(obj.path_id),
                      "name": "",
                      "export_status": "inventory_only",
                  }

                  try:
                      asset_type = obj.type.name
                      data = obj.read()

                      name = getattr(data, "name", "") or ""
                      record["name"] = name

                      filename = (
                          f"{index:04d}_"
                          f"{safe_name(name or asset_type)}_"
                          f"{obj.path_id}"
                      )

                      print(
                          f"[{index}] {asset_type}: "
                          f"{name or '(unnamed)'} "
                          f"path_id={obj.path_id}"
                      )

                      # Texture2D -> PNG
                      if asset_type == "Texture2D":
                          image = getattr(data, "image", None)

                          if image is not None:
                              destination = (
                                  OUTPUT / "textures" /
                                  f"{filename}.png"
                              )

                              image.save(destination)

                              record["export_status"] = "exported"
                              record["output"] = str(destination)

                              print("  Exported:", destination)

                          else:
                              record["export_status"] = (
                                  "image_unavailable"
                              )

                      # TextAsset -> raw binary
                      elif asset_type == "TextAsset":
                          content = getattr(
                              data, "m_Script", None
                          )

                          if content is not None:
                              destination = (
                                  OUTPUT / "textassets" /
                                  f"{filename}.bin"
                              )

                              destination.write_bytes(bytes(content))

                              record["export_status"] = "exported"
                              record["output"] = str(destination)

                      # AudioClip -> raw audio data, if available
                      elif asset_type == "AudioClip":
                          content = getattr(
                              data, "m_AudioData", None
                          )

                          if content:
                              destination = (
                                  OUTPUT / "audio" /
                                  f"{filename}.bin"
                              )

                              destination.write_bytes(bytes(content))

                              record["export_status"] = (
                                  "raw_audio_exported"
                              )
                              record["output"] = str(destination)

                      report["assets"].append(record)

                  except Exception as exc:
                      report["export_errors"].append({
                          "index": index,
                          "type": record["type"],
                          "path_id": record["path_id"],
                          "error": str(exc),
                      })

                      record["export_status"] = "error"
                      record["error"] = str(exc)

                      report["assets"].append(record)

                      print("  Asset error:", exc)

              report["asset_count"] = len(report["assets"])
              report["status"] = "completed"

          except Exception as exc:
              report["status"] = "failed"
              report["fatal_error"] = str(exc)
              report["traceback"] = traceback.format_exc()

              print(traceback.format_exc())

          finally:
              report_path = OUTPUT / "asset_report.json"

              report_path.write_text(
                  json.dumps(
                      report,
                      indent=2,
                      ensure_ascii=False,
                  ),
                  encoding="utf-8",
              )

              print("=" * 60)
              print("Status:", report["status"])
              print("Asset records:", report["asset_count"])
              print(
                  "Export errors:",
                  len(report["export_errors"]),
              )
              print("Report:", report_path)
              print("=" * 60)

          if report["status"] == "failed":
              raise SystemExit(1)
          PYTHON

      # 7. Run extractor
      - name: Extract Unity bundle
        run: |
          python extract_unity.py

      # 8. Show extraction results
      - name: Show extracted files
        if: always()
        run: |
          echo "===== OUTPUT FILES ====="
          find output -type f -printf '%p (%s bytes)\n' \
            2>/dev/null || true

      # 9. Upload report and extracted assets
      - name: Upload extraction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlux-UnityPy-Extraction
          path: output/
          if-no-files-found: warn