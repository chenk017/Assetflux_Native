name: AssetFlux - UnityPy Extractor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil file dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Siapkan Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # 3. Instal UnityPy
      - name: Install UnityPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install UnityPy

      # 4. Periksa file sampel
      - name: Check input bundle
        run: |
          FILE="samples/nextkagura_skill03_effect_1.unity3d"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: File bundle tidak ditemukan: $FILE"
            exit 1
          fi

          ls -lh "$FILE"

      # 5. Buat direktori hasil ekstraksi
      - name: Prepare output directories
        run: |
          mkdir -p output/textures
          mkdir -p output/textassets
          mkdir -p output/audio
          mkdir -p output/other

      # 6. Buat extractor
      - name: Create UnityPy extractor
        shell: bash
        run: |
          cat > extract_unity.py <<'PYTHON'
          import os
          import json
          import traceback
          from pathlib import Path

          import UnityPy

          SOURCE = Path(
              "samples/nextkagura_skill03_effect_1.unity3d"
          )

          OUTPUT = Path("output")

          for folder in [
              "textures",
              "textassets",
              "audio",
              "other",
          ]:
              (OUTPUT / folder).mkdir(
                  parents=True,
                  exist_ok=True
              )

          def safe_name(value):
              value = str(value or "unnamed")
              return "".join(
                  c if c.isalnum() or c in "-_." else "_"
                  for c in value
              )[:100]

          report = {
              "input": str(SOURCE),
              "file_size": SOURCE.stat().st_size,
              "unitypy_version": getattr(
                  UnityPy, "__version__", "unknown"
              ),
              "status": "starting",
              "asset_count": 0,
              "assets": [],
              "export_errors": [],
          }

          print("=" * 60)
          print("ASSETFLUX UNITYPY EXTRACTOR")
          print("=" * 60)
          print("Input:", SOURCE)
          print("Size:", SOURCE.stat().st_size, "bytes")

          try:
              # Membuka bundle dan serialized assets.
              env = UnityPy.load(str(SOURCE))

              for index, obj in enumerate(env.objects):
                  try:
                      asset_type = obj.type.name
                      path_id = int(obj.path_id)

                      record = {
                          "index": index,
                          "type": asset_type,
                          "path_id": path_id,
                          "name": "",
                          "export_status": "inventory_only",
                      }

                      print(
                          f"[{index}] {asset_type} "
                          f"path_id={path_id}"
                      )

                      data = obj.read()

                      name = getattr(data, "name", "") or ""
                      record["name"] = name

                      filename = (
                          f"{index:04d}_"
                          f"{safe_name(name or asset_type)}_"
                          f"{path_id}"
                      )

                      # Texture2D -> PNG
                      if asset_type == "Texture2D":
                          image = getattr(data, "image", None)

                          if image is not None:
                              destination = (
                                  OUTPUT / "textures" /
                                  f"{filename}.png"
                              )

                              image.save(destination)

                              record["export_status"] = "exported"
                              record["output"] = str(destination)

                              print("  Texture:", destination)
                          else:
                              record["export_status"] = (
                                  "image_unavailable"
                              )

                      # TextAsset -> TXT atau BIN
                      elif asset_type == "TextAsset":
                          script_data = getattr(
                              data, "m_Script", None
                          )

                          if script_data is not None:
                              destination = (
                                  OUTPUT / "textassets" /
                                  f"{filename}.bin"
                              )

                              destination.write_bytes(
                                  bytes(script_data)
                              )

                              record["export_status"] = "exported"
                              record["output"] = str(destination)

                      # AudioClip -> BIN
                      elif asset_type == "AudioClip":
                          audio_data = getattr(
                              data, "m_AudioData", None
                          )

                          if audio_data:
                              destination = (
                                  OUTPUT / "audio" /
                                  f"{filename}.bin"
                              )

                              destination.write_bytes(
                                  bytes(audio_data)
                              )

                              record["export_status"] = (
                                  "raw_audio_exported"
                              )
                              record["output"] = str(destination)

                      # Catat jenis asset lain tanpa menganggap
                      # semuanya sudah berhasil diekstrak.
                      report["assets"].append(record)

                  except Exception as exc:
                      error = {
                          "index": index,
                          "path_id": str(
                              getattr(obj, "path_id", "")
                          ),
                          "error": str(exc),
                      }

                      report["export_errors"].append(error)

                      print("  ERROR:", exc)

              report["asset_count"] = len(report["assets"])
              report["status"] = "completed"

          except Exception as exc:
              report["status"] = "failed"
              report["fatal_error"] = str(exc)
              report["traceback"] = traceback.format_exc()

              print(traceback.format_exc())

          finally:
              report_path = OUTPUT / "asset_report.json"

              report_path.write_text(
                  json.dumps(
                      report,
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )

              print("=" * 60)
              print("Status:", report["status"])
              print("Asset records:", report["asset_count"])
              print("Export errors:", len(report["export_errors"]))
              print("Report:", report_path)
              print("=" * 60)

          if report["status"] == "failed":
              raise SystemExit(1)
          PYTHON

      # 7. Jalankan ekstraksi
      - name: Extract Unity bundle
        run: |
          python extract_unity.py

      # 8. Tampilkan hasil
      - name: Show extracted files
        if: always()
        run: |
          echo "===== OUTPUT FILES ====="
          find output -type f -printf '%p (%s bytes)\n' \
            2>/dev/null || true

      # 9. Simpan hasil sebagai artifact
      - name: Upload extraction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlux-UnityPy-Extraction
          path: output/
          if-no-files-found: warn