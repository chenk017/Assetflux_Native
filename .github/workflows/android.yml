name: Build AssetFlux Native

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/assetflux/nativeviewer
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AssetFlux-Native"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.assetflux.nativeviewer'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.assetflux.nativeviewer'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "0.1.0"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="AssetFlux Native">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/assetflux/nativeviewer/MainActivity.kt <<'EOF'
          package com.assetflux.nativeviewer

          import android.app.Activity
          import android.os.Bundle
          import android.opengl.GLSurfaceView
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10

          class MainActivity : Activity() {

              private lateinit var glView: GLSurfaceView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  glView = GLSurfaceView(this)
                  glView.setEGLContextClientVersion(2)

                  glView.setRenderer(object : GLSurfaceView.Renderer {

                      override fun onSurfaceCreated(
                          gl: GL10?,
                          config: EGLConfig?
                      ) {
                          gl?.glClearColor(
                              0.05f,
                              0.05f,
                              0.05f,
                              1.0f
                          )
                      }

                      override fun onSurfaceChanged(
                          gl: GL10?,
                          width: Int,
                          height: Int
                      ) {
                          gl?.glViewport(0, 0, width, height)
                      }

                      override fun onDrawFrame(gl: GL10?) {
                          gl?.glClear(GL10.GL_COLOR_BUFFER_BIT)
                      }
                  })

                  setContentView(glView)
              }

              override fun onResume() {
                  super.onResume()
                  glView.onResume()
              }

              override fun onPause() {
                  glView.onPause()
                  super.onPause()
              }
          }
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlux-Native-debug
          path: app/build/outputs/apk/debug/app-debug.apk