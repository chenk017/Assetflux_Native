name: Build AssetFlux Native

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Install Android SDK
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager -type f | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Generate project
      - name: Generate AssetFlux project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/assetflux/nativeviewer
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AssetFlux-Native"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.assetflux.nativeviewer'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.assetflux.nativeviewer'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName "0.2.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:colorAccent">#6750A4</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="AssetFlux Native"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/assetflux/nativeviewer/MainActivity.kt <<'EOF'
          package com.assetflux.nativeviewer

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.net.Uri
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import java.io.DataInputStream
          import java.io.BufferedInputStream
          import java.io.ByteArrayInputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          class MainActivity : Activity() {

              private lateinit var resultText: TextView

              companion object {
                  private const val PICK_BUNDLE = 1001
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 32, 24, 24)
                      setBackgroundColor(0xFFF5F5F5.toInt())
                  }

                  val title = TextView(this).apply {
                      text = "AssetFlux Native"
                      textSize = 26f
                      setTextColor(0xFF292929.toInt())
                  }

                  val subtitle = TextView(this).apply {
                      text = "Unity AssetBundle Inspector"
                      textSize = 15f
                      setPadding(0, 4, 0, 20)
                  }

                  val selectButton = Button(this).apply {
                      text = "Pilih file .unity3d"
                      setOnClickListener { selectBundle() }
                  }

                  resultText = TextView(this).apply {
                      textSize = 14f
                      setTextColor(0xFF202020.toInt())
                      setPadding(0, 20, 0, 20)
                      text = """
                          AssetFlux Native v0.2

                          Tahap 1: UnityFS Header Inspector

                          Pilih file Unity AssetBundle
                          untuk memeriksa header dan
                          versi Unity yang tercatat.

                          Catatan:
                          Pemeriksaan header belum berarti
                          seluruh asset berhasil diekstrak.
                      """.trimIndent()
                  }

                  val scroll = ScrollView(this).apply {
                      addView(resultText)
                  }

                  root.addView(title)
                  root.addView(subtitle)
                  root.addView(selectButton)

                  root.addView(
                      scroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  setContentView(root)
              }

              private fun selectBundle() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "*/*"
                  }

                  startActivityForResult(intent, PICK_BUNDLE)
              }

              @Deprecated("Uses the Android document picker callback")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode != PICK_BUNDLE ||
                      resultCode != RESULT_OK) {
                      return
                  }

                  val uri = data?.data ?: return

                  resultText.text = "Membaca file...\n"

                  Thread {
                      val report = try {
                          contentResolver.openInputStream(uri).use { input ->
                              requireNotNull(input) {
                                  "File tidak dapat dibuka."
                              }

                              inspectBundle(input.readBytes())
                          }
                      } catch (e: Exception) {
                          "Gagal membaca file:\n${e.message}"
                      }

                      runOnUiThread {
                          resultText.text = report
                      }
                  }.start()
              }

              private fun inspectBundle(bytes: ByteArray): String {
                  if (bytes.size < 16) {
                      return "File terlalu kecil untuk menjadi bundle UnityFS."
                  }

                  val input = DataInputStream(
                      BufferedInputStream(ByteArrayInputStream(bytes))
                  )

                  fun readCString(): String {
                      val output = StringBuilder()

                      while (true) {
                          val value = input.read()
                          if (value < 0) {
                              error("String header tidak lengkap.")
                          }
                          if (value == 0) break

                          output.append(value.toChar())

                          if (output.length > 4096) {
                              error("String header terlalu panjang.")
                          }
                      }

                      return output.toString()
                  }

                  val signature = readCString()

                  if (signature != "UnityFS") {
                      return """
                          Format bukan UnityFS.

                          Signature: $signature
                          Ukuran file: ${bytes.size} byte

                          Bundle ini mungkin menggunakan format lain.
                      """.trimIndent()
                  }

                  val formatVersion = input.readInt()
                  val playerVersion = readCString()
                  val engineVersion = readCString()

                  val bundleSize = input.readLong()
                  val compressedInfoSize = input.readInt()
                  val uncompressedInfoSize = input.readInt()
                  val flags = input.readInt()

                  val compressionType = flags and 0x3F

                  val compressionName = when (compressionType) {
                      0 -> "None"
                      1 -> "LZMA"
                      2 -> "LZ4"
                      3 -> "LZ4HC"
                      else -> "Unknown ($compressionType)"
                  }

                  val headerEnd = bytes.size -
                      input.available()

                  val sizeStatus = if (bundleSize == bytes.size.toLong()) {
                      "Cocok"
                  } else {
                      "Berbeda dari ukuran aktual"
                  }

                  return """
                      ASSETFLUX NATIVE
                      ==============================

                      HASIL PEMERIKSAAN HEADER

                      Signature:
                      $signature

                      Format version:
                      $formatVersion

                      Unity player version:
                      $playerVersion

                      Unity engine version:
                      $engineVersion

                      Ukuran bundle di header:
                      $bundleSize byte

                      Ukuran file aktual:
                      ${bytes.size} byte

                      Pemeriksaan ukuran:
                      $sizeStatus

                      Compressed block-info size:
                      $compressedInfoSize byte

                      Uncompressed block-info size:
                      $uncompressedInfoSize byte

                      Flags:
                      0x${flags.toUInt().toString(16).uppercase()}

                      Compression block-info:
                      $compressionName

                      Posisi akhir header:
                      $headerEnd byte

                      ==============================

                      STATUS:
                      Header berhasil dibaca.

                      LANGKAH BERIKUTNYA:
                      Membaca metadata UnityFS,
                      mendekompresi blok data,
                      lalu memeriksa serialized assets.

                      Belum ada klaim bahwa Mesh,
                      Material, Texture, atau animasi
                      berhasil diekstrak.
                  """.trimIndent()
              }
          }
          EOF

      # 6. Generate Gradle Wrapper
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      # 7. Build APK
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      # 8. Verify APK
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetFlux-Native-v0.2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error